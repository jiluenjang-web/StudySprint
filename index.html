<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StudySprint 智慧讀書任務排程器">
  <title>StudySprint — 智慧讀書任務排程器</title>
  <style>
    :root {
      --page: #f4f6f9;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #68748b;
      --line: #e5e9f0;
      --primary: #6255e7;
      --primary-soft: #eeecff;
      --danger: #d74755;
      --success: #168b6a;
      --sidebar: #172033;
      --shadow: 0 18px 48px rgba(30, 40, 70, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--page);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 36px 30px;
      color: #fff;
      background: radial-gradient(circle at 20% 15%, rgba(137, 122, 255, 0.34), transparent 34%), var(--sidebar);
    }

    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #8c80ff, #5a4ee0);
    }

    .sidebar-copy { margin: auto 0; }
    .eyebrow { color: #aaa3ff; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .sidebar h1 { margin: 14px 0 0; font-size: 3.25rem; line-height: 0.98; letter-spacing: -0.06em; }
    .sidebar p:last-child { color: #b8c1d4; font-size: 0.9rem; line-height: 1.7; }
    .version { color: #7f8ba2; font-size: 0.76rem; }

    main { width: min(1080px, 100%); margin: 0 auto; padding: 46px clamp(22px, 4vw, 58px) 60px; }
    .topbar { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .topbar h2 { margin: 0; font-size: 2rem; letter-spacing: -0.04em; }
    .topbar p { margin: 7px 0 0; color: var(--muted); }
    .date-chip { align-self: flex-start; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 9px 13px; color: var(--muted); font-size: 0.8rem; font-weight: 700; }

    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(250px, 0.75fr); gap: 22px; }
    .panel { border: 1px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
    .form-panel, .tasks-section, .plan-section { padding: 27px; }
    .panel-heading { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 22px; }
    .panel-heading h3, .tasks-heading h3, .plan-heading h3 { margin: 0; font-size: 1.05rem; }
    .panel-heading span { color: var(--muted); font-size: 0.78rem; }

    .task-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field-full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 7px; color: #3c465a; font-size: 0.8rem; font-weight: 750; }
    .required { color: var(--danger); }
    input, select { width: 100%; height: 47px; border: 1px solid var(--line); border-radius: 11px; outline: none; background: #f8fafc; padding: 0 14px; }
    input:focus, select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px var(--primary-soft); }
    .error { min-height: 17px; margin: 4px 2px 0; color: var(--danger); font-size: 0.72rem; }
    .button-row { display: flex; justify-content: flex-end; grid-column: 1 / -1; }
    .primary-button { min-height: 47px; border: 0; border-radius: 11px; color: #fff; background: var(--primary); padding: 0 20px; font-weight: 800; box-shadow: 0 10px 22px rgba(98, 85, 231, 0.23); }

    .summary-panel { display: flex; flex-direction: column; justify-content: space-between; padding: 27px; color: #fff; background: linear-gradient(145deg, #6d61eb, #5146c9); border: 0; }
    .summary-label { color: #d9d6ff; font-size: 0.76rem; font-weight: 800; text-transform: uppercase; }
    .time-wrap { position: relative; margin-top: 20px; }
    .time-wrap input { height: 70px; border-color: rgba(255,255,255,.2); color: #fff; background: rgba(255,255,255,.12); padding-right: 70px; font-size: 1.9rem; font-weight: 850; }
    .time-wrap span { position: absolute; top: 50%; right: 16px; color: #dddafe; font-size: .8rem; font-weight: 700; transform: translateY(-50%); }
    .summary-note { color: #d9d6ff; font-size: .78rem; line-height: 1.6; }
    .generate-button { width: 100%; min-height: 47px; margin-top: 14px; border: 0; border-radius: 11px; color: #4e43c8; background: #fff; font-size: .8rem; font-weight: 850; }
    .summary-stat { margin-top: 28px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.17); }
    .summary-stat strong { display: block; font-size: 1.8rem; }
    .summary-stat span { color: #d9d6ff; font-size: .75rem; }

    .plan-section { margin-top: 22px; border-color: #dcd8ff; background: linear-gradient(180deg, #fbfaff, #f5f3ff); }
    .plan-section[hidden] { display: none; }
    .plan-heading { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .planned-total { color: #4e43c8; font-size: .78rem; font-weight: 850; }
    .progress-wrap { margin-bottom: 20px; border: 1px solid #e4e1f7; border-radius: 14px; background: #fff; padding: 14px 16px; }
    .progress-copy { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: .76rem; }
    .progress-copy strong { font-size: 1.3rem; }
    .progress-track { height: 8px; overflow: hidden; border-radius: 999px; background: #e8e5f5; }
    .progress-fill { display: block; width: 0; height: 100%; background: var(--primary); transition: width .3s ease; }
    .timeline { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .plan-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; border: 1px solid #e4e1f7; border-radius: 14px; background: #fff; padding: 16px 18px; }
    .plan-card-main { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
    .plan-card h4 { margin: 0; overflow-wrap: anywhere; }
    .plan-card p { margin: 5px 0 0; color: var(--muted); font-size: .73rem; }
    .allocation { flex: 0 0 auto; color: #4e43c8; font-size: 1.1rem; font-weight: 850; }
    .plan-checkbox { width: 23px; height: 23px; margin: 0; accent-color: var(--success); }
    .plan-card.completed { border-color: #cce8df; background: #f7fcfa; }
    .plan-card.completed h4 { color: #84908e; text-decoration: line-through; }

    .tasks-section { margin-top: 22px; }
    .tasks-heading { display: flex; justify-content: space-between; margin-bottom: 18px; }
    .task-count { border-radius: 999px; color: var(--primary); background: var(--primary-soft); padding: 4px 10px; font-size: .76rem; font-weight: 800; }
    .task-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .task-card { display: flex; flex-direction: column; min-height: 160px; border: 1px solid var(--line); border-radius: 15px; padding: 18px; }
    .task-card-top { display: flex; justify-content: space-between; gap: 12px; }
    .task-card h4 { margin: 0; overflow-wrap: anywhere; }
    .importance, .priority { display: inline-flex; margin-top: 9px; border-radius: 999px; padding: 4px 8px; color: var(--primary); background: var(--primary-soft); font-size: .68rem; font-weight: 800; }
    .priority { margin: 0; color: #c83f4d; background: #fff0f1; white-space: nowrap; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; color: var(--muted); font-size: .76rem; }
    .delete { align-self: flex-start; margin-top: auto; border: 0; color: var(--danger); background: transparent; padding: 5px 0; font-size: .75rem; font-weight: 750; }
    .empty { grid-column: 1 / -1; border: 1px dashed #d7dce6; border-radius: 15px; background: #f8fafc; padding: 45px 20px; text-align: center; color: var(--muted); }

    .toast { position: fixed; right: 22px; bottom: 22px; border: 1px solid #d8eee7; border-radius: 12px; color: #12634e; background: #f1fbf7; padding: 11px 15px; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: .18s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 220px minmax(0, 1fr); }
      .dashboard-grid, .task-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 650px) {
      .app-shell { display: block; }
      .sidebar { position: relative; height: auto; min-height: 280px; padding: 28px 22px; }
      .sidebar-copy { margin: 45px 0 25px; }
      main { padding: 30px 17px 46px; }
      .topbar { display: block; }
      .date-chip { display: inline-block; margin-top: 14px; }
      .task-form { grid-template-columns: 1fr; }
      .field-full, .button-row { grid-column: auto; }
      .primary-button { width: 100%; }
      .plan-card { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">⚡</span><span>StudySprint</span></div>
      <div class="sidebar-copy">
        <p class="eyebrow">Plan your focus</p>
        <h1>Study<br>Sprint.</h1>
        <p>把腦中的待辦變成清楚的讀書任務，從今天能完成的事情開始。</p>
      </div>
      <div class="version">Development iteration 1</div>
    </aside>

    <main>
      <header class="topbar">
        <div><h2>今天，從一件事開始。</h2><p>新增任務，建立你的讀書節奏。</p></div>
        <div class="date-chip" id="todayLabel"></div>
      </header>

      <section class="dashboard-grid">
        <div class="panel form-panel">
          <div class="panel-heading"><h3>新增任務</h3><span>建立下一個行動</span></div>
          <form class="task-form" id="taskForm" novalidate>
            <div class="field-full">
              <label for="taskName">任務名稱 <span class="required">*</span></label>
              <input id="taskName" name="taskName" maxlength="80" placeholder="例如：完成數學作業">
              <p class="error" id="taskNameError"></p>
            </div>
            <div>
              <label for="deadline">Deadline <span class="required">*</span></label>
              <input id="deadline" name="deadline" type="date">
              <p class="error" id="deadlineError"></p>
            </div>
            <div>
              <label for="minutes">預估分鐘數 <span class="required">*</span></label>
              <input id="minutes" name="minutes" type="number" min="1" max="1440" placeholder="例如：60">
              <p class="error" id="minutesError"></p>
            </div>
            <div class="field-full">
              <label for="importance">Importance <span class="required">*</span></label>
              <select id="importance" name="importance">
                <option value="">選擇重要程度</option>
                <option value="1">1 — 很低</option><option value="2">2 — 低</option>
                <option value="3">3 — 中等</option><option value="4">4 — 高</option>
                <option value="5">5 — 最高</option>
              </select>
              <p class="error" id="importanceError"></p>
            </div>
            <div class="button-row"><button class="primary-button" type="submit">＋ Add Task</button></div>
          </form>
        </div>

        <section class="panel summary-panel">
          <div>
            <div class="summary-label">今日可用時間</div>
            <div class="time-wrap"><input id="availableMinutes" type="number" min="1" max="1440" placeholder="120"><span>分鐘</span></div>
            <p class="summary-note">先記下今天能專注投入的時間。</p>
            
          </div>
          <div class="summary-stat"><strong id="taskCountSummary">0</strong><span>目前任務</span></div>
        </section>
      </section>

      

      <section class="panel tasks-section">
        <div class="tasks-heading"><h3>任務清單</h3><span class="task-count" id="taskCount">0</span></div>
        <div class="task-list" id="taskList"></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "studySprintIteration1";
    const tasks = [];
    let currentPlan = [];
    const form = document.querySelector("#taskForm");
    const taskList = document.querySelector("#taskList");
    const deadlineInput = document.querySelector("#deadline");
    const availableInput = document.querySelector("#availableMinutes");

    function localDate(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return year + "-" + month + "-" + day;
    }

    function showToast(message) {
      const toast = document.querySelector("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function escapeHTML(value) {
      const element = document.createElement("div");
      element.textContent = value;
      return element.innerHTML;
    }

    function rankedTasks() { return [...tasks]; }

    function saveState() {}

    function renderTasks() {
      document.querySelector("#taskCount").textContent = tasks.length;
      document.querySelector("#taskCountSummary").textContent = tasks.length;
      if (!tasks.length) {
        taskList.innerHTML = '<div class="empty">還沒有任務，新增第一個任務開始 StudySprint。</div>';
        return;
      }
      taskList.innerHTML = rankedTasks().map(task => {
        const priorityMarkup = "";
        return '<article class="task-card"><div class="task-card-top"><div><h4>' + escapeHTML(task.name) + '</h4><span class="importance">Importance ' + task.importance + '</span></div>' + priorityMarkup + '</div><div class="task-meta"><span>' + task.deadline + '</span><span>' + task.minutes + ' 分鐘</span></div><button class="delete" data-delete="' + task.id + '">刪除</button></article>';
      }).join("");
    }

    

    form.addEventListener("submit", event => {
      event.preventDefault();
      const data = new FormData(form);
      const name = data.get("taskName").trim();
      const deadline = data.get("deadline");
      const minutes = Number(data.get("minutes"));
      const importance = Number(data.get("importance"));
      ["taskName", "deadline", "minutes", "importance"].forEach(id => document.querySelector("#" + id + "Error").textContent = "");
      let valid = true;
      if (!name) { document.querySelector("#taskNameError").textContent = "請輸入任務名稱"; valid = false; }
      if (!deadline) { document.querySelector("#deadlineError").textContent = "請選擇 Deadline"; valid = false; }
      if (!Number.isInteger(minutes) || minutes < 1) { document.querySelector("#minutesError").textContent = "請輸入正整數分鐘"; valid = false; }
      if (importance < 1 || importance > 5) { document.querySelector("#importanceError").textContent = "請選擇重要程度"; valid = false; }
      if (!valid) return;
      tasks.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), name, deadline, minutes, importance, createdAt: Date.now() });
      currentPlan = [];
      
      renderTasks();
      saveState();
      form.reset();
      deadlineInput.value = localDate();
      showToast("任務已新增");
    });

    taskList.addEventListener("click", event => {
      const button = event.target.closest("[data-delete]");
      if (!button) return;
      const index = tasks.findIndex(task => task.id === button.dataset.delete);
      if (index >= 0) tasks.splice(index, 1);
      currentPlan = [];
      
      renderTasks();
      saveState();
    });

    document.querySelector("#todayLabel").textContent = new Intl.DateTimeFormat("zh-TW", { month: "long", day: "numeric", weekday: "short" }).format(new Date());
    deadlineInput.value = localDate();
    
    renderTasks();
  </script>
</body>
</html>
